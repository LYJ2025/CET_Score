#
# 版本目录（Version Catalog）
# 所有版本号均已对照 Maven 官方仓库核实，非虚构。
# 核实方式：读取 repo1.maven.org / dl.google.com 的 maven-metadata.xml
#
[versions]
# ---------- 构建工具 ----------
agp = "8.13.2"                 # com.android.tools.build:gradle 末代 8.x（9.x 变动较大，targetSdk34 场景 8.x 更稳）
kotlin = "2.2.21"              # org.jetbrains.kotlin:kotlin-gradle-plugin
ksp = "2.2.21-2.0.5"            # 与 kotlin 2.2.21 严格配对；Room 用 KSP 而非 KAPT
coreKtx = "1.18.0"             # androidx.core:core-ktx
appcompat = "1.7.1"

# ---------- Compose ----------
composeBom = "2026.05.01"      # androidx.compose:compose-bom，统一管理 ui/foundation/material3
activityCompose = "1.12.4"      # androidx.activity:activity-compose
lifecycle = "2.9.4"           # androidx.lifecycle:lifecycle-*（ViewModel Compose / Runtime Compose）

# ---------- 导航 ----------
navigationCompose = "2.9.5"   # androidx.navigation:navigation-compose

# ---------- Room ----------
room = "2.8.5"                 # androidx.room:room-runtime / room-ktx / room-compiler

# ---------- 第三方：毛玻璃 & 图表 ----------
# Haze 锁定 1.7.0：1.7.3 的 AAR 元数据要求 minCompileSdk=37 / AGP 9.1+，
# 会与本项目 targetSdk34 + AGP 8.13.2 + compileSdk 36 的组合冲突。
# 1.7.0 无该限制，且 API 与 1.7.3 一致（hazeEffect(state) { blurRadius/tint }）。
haze = "1.7.0"                 # dev.chrisbanes.haze:haze
vico = "3.2.3"                 # com.patrykandpatrick.vico:compose-m3
                                # 3.3.x 依赖 Compose Multiplatform 1.12.0（需 compileSdk 37 / AGP 9.1+），
                                # 3.2.3 依赖 CMP 1.11.0，与本项目 compose BOM 2026.05.01 匹配。

# ---------- 其他 ----------
coroutines = "1.11.0"          # org.jetbrains.kotlinx:kotlinx-coroutines-android
serialization = "1.11.0"       # org.jetbrains.kotlinx:kotlinx-serialization-json
                               # 插件版本须与 kotlin 严格一致，见下方 plugins.kotlin-serialization
junit = "4.13.2"
androidxJunit = "1.3.0"
androidxTestCore = "1.7.0"    # ApplicationProvider，Robolectric 测试要用
espresso = "3.7.0"
robolectric = "4.17"           # 单元测试跑 Room DAO（免真机/模拟器）

[libraries]
# ---------- AndroidX 基础 ----------
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }

# ---------- Compose（BOM 管理版本，勿在此处写 version） ----------
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }

# ---------- Lifecycle ----------
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# ---------- Navigation ----------
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

# ---------- Room ----------
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-testing = { module = "androidx.room:room-testing", version.ref = "room" }

# ---------- 毛玻璃 ----------
# 采用 1.7.3（1.x 末代稳定版），API 简洁：
#   Modifier.hazeEffect(state) { blurRadius = 24.dp; tint = ... }
# 若日后升级到 2.x：blur 已拆为独立 haze-blur 模块，且配置需包进 blurEffect { } 中。
haze-core = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }

# ---------- Vico 图表 ----------
# 注意：Vico 3.x 没有独立的 :core artifact（那是 2.x 的结构）。
# compose-m3 会自动传递 com.patrykandpatrick.vico:compose，勿手动加 :core。
vico-compose-m3 = { module = "com.patrykandpatrick.vico:compose-m3", version.ref = "vico" }

# ---------- 其他 ----------
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

# ---------- 测试 ----------
junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }

# ---------- Gradle 插件 ----------
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# serialization 编译器插件版本必须与 kotlin 一致，否则报 "plugin version mismatch"
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
